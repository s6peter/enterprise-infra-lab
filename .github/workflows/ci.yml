---
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible lint / syntax / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.17" ansible-lint yamllint

      - name: Install collection dependencies
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

      - name: Syntax check (all environments)
        run: |
          for env in dev qa prod; do
            echo "== syntax-check: ${env} =="
            ansible-playbook -i "inventories/${env}/hosts.ini" \
              playbooks/site.yml --syntax-check
          done

      - name: Build company.infrastructure collection
        run: |
          ansible-galaxy collection build \
            collections/ansible_collections/company/infrastructure \
            --output-path dist/ --force

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: company-infrastructure-collection
          path: dist/*.tar.gz

  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate
