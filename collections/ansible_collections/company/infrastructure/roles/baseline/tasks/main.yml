---
- name: Ensure baseline packages are present
  ansible.builtin.package:
    name: "{{ baseline_extra_packages }}"
    state: present

# Timezone is set with pure ansible.builtin so the role needs no external
# collections -- it runs in any Execution Environment, including air-gapped.
- name: Set the system timezone (/etc/localtime)
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ baseline_timezone }}"
    dest: /etc/localtime
    state: link
    force: true
  notify: Restart cron

- name: Persist the timezone name in /etc/timezone
  ansible.builtin.copy:
    dest: /etc/timezone
    content: "{{ baseline_timezone }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart cron

- name: Deploy the managed message-of-the-day
  ansible.builtin.copy:
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
    content: |
      ***********************************************************************
      * {{ inventory_hostname }} -- managed by company.infrastructure
      * Environment: {{ env | default('unknown') }}
      * Unauthorized access is prohibited. Manual changes are overwritten.
      ***********************************************************************
