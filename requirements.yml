---
# The company.infrastructure roles use only ansible.builtin, so there are no
# external collection dependencies to install. This file is kept as the
# conventional place to declare them if you add roles/modules that need one.
#
# NOTE for AAP/AWX: it deliberately does NOT auto-install from this root path --
# only from collections/requirements.yml. We omit that file on purpose so an
# air-gapped controller never tries to reach galaxy.ansible.com on project sync.
collections: []
