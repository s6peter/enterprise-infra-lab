[defaults]
# Default to the dev environment; override with -i for qa/prod.
inventory = inventories/dev/hosts.ini
# Our own collection resolves from ./collections; deps from ~/.ansible/collections.
collections_path = ~/.ansible/collections:./collections
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
